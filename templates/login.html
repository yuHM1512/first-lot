<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - 1st Lot Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --bg: #f8fafc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(79, 70, 229, 0.05) 0px, transparent 50%);
        }

        .login-card {
            border: none;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        .card-header-custom {
            background: #1e293b;
            color: white;
            border-radius: 24px 24px 0 0 !important;
            padding: 1.5rem !important;
        }

        .btn-primary-custom {
            background-color: var(--primary);
            border: none;
            padding: 0.8rem;
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.2s;
        }

        .btn-primary-custom:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgb(79 70 229 / 0.2);
        }

        .form-control-custom {
            border-radius: 12px;
            padding: 0.8rem 1rem;
            border: 2px solid #e2e8f0;
            transition: all 0.2s;
        }

        .form-control-custom:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .logo-container {
            padding: 2rem 0;
        }

        .logo-container img {
            max-height: 80px;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .logo-container img:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body class="bg-light">
    <div class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card login-card" style="max-width: 420px; width: 100%;">
            <div class="text-center logo-container">
                <img src="/static/Logo.png" alt="Logo" class="img-fluid">
            </div>
            <div class="card-header card-header-custom text-center">
                <h5 class="mb-0"><i class="fas fa-lock me-2"></i>Đăng nhập hệ thống</h5>
            </div>
            <div class="card-body p-4 p-md-5">
                <div class="mb-4">
                    <label class="form-label text-[10px] fw-bold text-uppercase text-secondary tracking-wider mb-2"
                        style="font-size: 0.7rem;">Mã nhân viên</label>
                    <input type="text" class="form-control form-control-custom" id="loginEmployeeCode"
                        placeholder="Ví dụ: D0784" autofocus>
                    <!-- Hidden input to store next URL from backend -->
                    <input type="hidden" id="nextUrl" value="{{ next or '' }}">
                </div>
                <button class="btn btn-primary btn-primary-custom w-100 shadow-sm" onclick="doLogin()" id="loginBtn">
                    <i class="fas fa-sign-in-alt me-2"></i>Đăng nhập
                </button>
                <div class="text-center mt-4">
                    <p class="text-muted mb-0" style="font-size: 0.8rem;">Vui lòng sử dụng mã nhân viên đã được đăng ký
                        trong danh sách email nhân sự.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Allow Enter key to trigger login
        document.getElementById('loginEmployeeCode').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                doLogin();
            }
        });

        async function doLogin() {
            const codeInput = document.getElementById('loginEmployeeCode');
            const loginBtn = document.getElementById('loginBtn');
            const code = codeInput.value.trim();

            if (!code) {
                alert('Vui lòng nhập mã nhân viên');
                return;
            }

            // UI Feedback
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Đang xử lý...';

            try {
                const formData = new FormData();
                formData.append('employee_code', code);

                const res = await fetch('/api/login', {
                    method: 'POST',
                    body: formData
                });

                if (res.ok) {
                    const employeeData = await res.json();

                    // Logic from user request
                    const urlParams = new URLSearchParams(window.location.search);
                    const roleRequired = urlParams.get('role_required');

                    if (roleRequired) {
                        const roles = roleRequired.split(' hoặc ');
                        const hasRole = roles.some(r => employeeData.role && employeeData.role.includes(r));
                        if (!hasRole) {
                            alert('Bạn không có quyền truy cập tính năng này');
                            loginBtn.disabled = false;
                            loginBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Đăng nhập';
                            return;
                        }
                    }

                    const nextVal = document.getElementById('nextUrl').value;
                    const nextParam = urlParams.get('next');
                    const targetUrl = nextVal || nextParam;

                    if (targetUrl) {
                        window.location.href = targetUrl;
                    } else {
                        window.location.href = '/first-lot/';
                    }
                } else {
                    const err = await res.json().catch(() => ({}));
                    alert('Đăng nhập thất bại: ' + (err.detail || 'Mã nhân viên không hợp lệ'));
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Đăng nhập';
                }
            } catch (e) {
                console.error(e);
                alert('Đã xảy ra lỗi kết nối hệ thống');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Đăng nhập';
            }
        }
    </script>
</body>

</html>
